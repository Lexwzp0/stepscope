[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepscope"
version = "0.0.1"
description = "Post-training analysis platform: what each update step does to model behaviour, per source and per layer, checked against the real update."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyarrow>=14",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "transformers>=4.40"]
attribution = ["dattri-llm", "bergson"]
nnsight = ["nnsight"]
eval = ["lighteval"]
gen = ["vllm"]
dev = ["pytest>=7", "ruff"]

[project.scripts]
stepscope = "stepscope.cli.main:main"

[tool.setuptools.packages.find]
include = ["stepscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
