[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepscope"
version = "0.1.0"
description = "A research toolkit for post-training dynamics: what each update step does to model behaviour, checked against the real update."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Zepeng Wang"}]
requires-python = ">=3.10"
keywords = ["post-training", "learning dynamics", "RLHF", "RLVR", "distillation", "interpretability", "LLM"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pyarrow>=14",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "transformers>=4.45", "safetensors>=0.4"]
attribution = ["dattri-llm", "bergson"]
nnsight = ["nnsight"]
eval = ["lighteval"]
gen = ["vllm"]
dev = ["pytest>=7", "ruff"]

[project.urls]
Homepage = "https://github.com/Lexwzp0/stepscope"
Repository = "https://github.com/Lexwzp0/stepscope"
Issues = "https://github.com/Lexwzp0/stepscope/issues"

[project.scripts]
stepscope = "stepscope.cli.main:main"

[tool.setuptools.packages.find]
include = ["stepscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
